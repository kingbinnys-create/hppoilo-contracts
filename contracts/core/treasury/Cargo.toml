[package]
name = "astroid-treasury"
description = "Astroid Treasury contract: organizational fund custody with budget, policy, and multisig enforcement."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
astroid-shared = { workspace = true }
astroid-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Issue #308 tests deploy the real registry (to exercise the caller-verification
# gate end to end) and the real wallet (as a registered, first-class depositor).
astroid-registry = { workspace = true }
astroid-wallet = { workspace = true }
