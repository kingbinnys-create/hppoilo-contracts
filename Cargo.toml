# Astroid — Smart Contract Workspace (Soroban / Stellar)
#
# The blockchain / trust layer of the Astroid platform: a Financial Operating
# System for autonomous AI agents on Stellar. See PRD Document 7 for the
# authoritative smart-contract architecture.
#
# soroban-sdk is pinned once here (v21.x) and referenced by every member via
# `soroban-sdk = { workspace = true }` so all crates build against one version.
#
# The codebase is split into two Cargo workspaces:
#   1. This root workspace: shared libraries, interfaces, the four core
#      protocol contracts (registry, wallet, treasury, multisig) and the
#      integration test suite, which deploys every contract into one Env.
#   2. `contracts/modules/`: the four governance/extension module contracts
#      (proposal, budget, policy, escrow), with their own Cargo.toml,
#      Cargo.lock and target dir.
# The two halves reference each other across the boundary through plain path
# dependencies (the root integration tests need all eight contracts; the
# proposal tests need multisig), so run cargo commands in both directories.

[workspace]
resolver = "2"
members = [
    "shared",
    "interfaces",
    "contracts/core/registry",
    "contracts/core/wallet",
    "contracts/core/multisig",
    "contracts/core/treasury",
    "tests",
]
exclude = [
    "contracts/modules",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Astroid <opensource@astroid.dev>"]
repository = "https://github.com/AstroidHQ/hppoilo-contracts"
homepage = "https://astroid.dev"
rust-version = "1.74"

[workspace.dependencies]
# Single, consistent Soroban SDK version for the whole workspace.
soroban-sdk = "21.7.7"
astroid-shared = { path = "shared" }
astroid-interfaces = { path = "interfaces" }
astroid-registry = { path = "contracts/core/registry" }
astroid-wallet = { path = "contracts/core/wallet" }
astroid-multisig = { path = "contracts/core/multisig" }
astroid-treasury = { path = "contracts/core/treasury" }
astroid-proposal = { path = "contracts/modules/proposal" }
astroid-budget = { path = "contracts/modules/budget" }
astroid-policy = { path = "contracts/modules/policy" }
astroid-escrow = { path = "contracts/modules/escrow" }

# ---------------------------------------------------------------------------
# Release profile tuned for Soroban Wasm output (small, deterministic, safe).
# overflow-checks stays ON even in release: financial arithmetic must never
# silently wrap. All value math additionally goes through shared::math checked
# helpers that return contract errors instead of panicking.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps debug assertions/logs — handy for local Wasm debugging.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
