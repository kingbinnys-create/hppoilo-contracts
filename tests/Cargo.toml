[package]
name = "astroid-integration-tests"
description = "End-to-end integration tests for the Astroid contract workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
astroid-shared = { workspace = true }
astroid-interfaces = { workspace = true }

# Integration tests deploy every workspace contract into a shared Env, so all
# eight contracts are compiled in as dev-dependencies.
astroid-budget = { workspace = true }
astroid-escrow = { workspace = true }
astroid-multisig = { workspace = true }
astroid-policy = { workspace = true }
astroid-proposal = { workspace = true }
astroid-registry = { workspace = true }
astroid-treasury = { workspace = true }
astroid-wallet = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
